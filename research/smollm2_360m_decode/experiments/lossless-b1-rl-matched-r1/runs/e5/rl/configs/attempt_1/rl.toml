TINY_MATCH_TRACE = "/home/pradheep/tiny-prl/prime-rl/outputs/megakernel-20261025/lossless-b1-rl-matched-r1/runs/e5/trace"
PYTHONPATH = "/home/pradheep/tiny-prl/prime-rl/outputs/megakernel-20261025/lossless-b1-rl-matched-r1/python:/home/pradheep/tiny-prl/prime-rl/src:/home/pradheep/tiny-prl/prime-rl/packages/prime-rl-configs/src:/home/pradheep/tiny-prl/prime-kernels"
TORCH_EXTENSIONS_DIR = "/home/pradheep/tiny-prl/prime-rl/outputs/megakernel-20261025/lossless-b2-vadd2-r1/codec-build"
